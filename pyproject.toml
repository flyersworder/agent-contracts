[project]
name = "ai-agent-contracts"
# Version must match src/agent_contracts/__init__.py:__version__
version = "0.4.0"
description = "A formal framework for governing autonomous AI agents through explicit resource constraints and temporal boundaries"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Qing", email = "qingye779@gmail.com" }]
license = { text = "Apache-2.0" }
keywords = ["ai-agents", "llm", "resource-management", "governance", "contracts", "langchain", "langgraph", "google-adk", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "python-dotenv>=1.2",
]

[project.urls]
Homepage = "https://github.com/flyersworder/agent-contracts"
Repository = "https://github.com/flyersworder/agent-contracts"
Issues = "https://github.com/flyersworder/agent-contracts/issues"
Documentation = "https://github.com/flyersworder/agent-contracts/blob/main/docs/README.md"

[project.optional-dependencies]
litellm = [
    "litellm>=1.97",
]
eval = [
    "datasets>=5.0",
    "matplotlib>=3.11",
]
langchain = [
    "langchain>=1.3",
    "langchain-core>=1.6",
    "langchain-google-genai>=4.3",
]
langgraph = [
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-core>=1.6",
]
google-adk = [
    "google-adk>=2.7",
]
claude-agent-sdk = [
    "claude-agent-sdk>=0.2.143",
]
chambers = [
    "causal-learn>=0.1.4",
    # Causal Chamber benchmark — Gamella et al. NMI 2025
    # See docs/causal_chamber_validation_plan.md for the AAMAS/ECAI 2027 pillar
    "causalchamber>=0.2",
    "numpy>=2.5,<2.6",  # avoid yanked numpy 2.4.0; see plan §4.4 / R4
    "pandas>=3.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    "ruff>=0.16",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "scipy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_contracts"]

# The sdist ships what is needed to build the package and verify that build —
# the library and its test suite — plus the metadata files. Everything else in
# this repository is research apparatus, not part of the distribution:
# `evaluation/` and `results/` hold experiment pipelines, figures, and run
# output (2.6 MB and 1.7 MB respectively); `benchmarks/` holds demo scripts;
# `docs/` is published on GitHub and linked from the README; `uv.lock` pins a
# development environment that an installer resolves fresh anyway.
#
# This is an explicit allowlist rather than an exclude list so that new
# top-level directories do not silently start shipping. `LICENSE` is listed
# because `project.license` is declared as text, so hatchling does not infer it.
#
# `tests/evaluation` is excluded because it tests the `evaluation/` package,
# which the sdist does not ship — those tests fail collection with
# `ModuleNotFoundError: No module named 'evaluation'` no matter what the
# installing environment does. The remaining tests exercise the shipped
# library; `tests/integrations` additionally needs the optional extras.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/SECURITY.md",
]
exclude = [
    "/tests/evaluation",
]

[tool.ruff]
# Target Python 3.12+
target-version = "py312"

# Line length
line-length = 100

# Exclude common directories
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), isort (I), and more
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Test files can use assertions and relative imports
"tests/**/*.py" = ["S101", "TID252"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Integration modules use try/except imports for optional dependencies,
# which conflicts with strict mypy when the packages are installed.
[[tool.mypy.overrides]]
module = [
    "agent_contracts",
    "agent_contracts.integrations",
    "agent_contracts.integrations.litellm_wrapper",
    "agent_contracts.integrations.langchain",
    "agent_contracts.integrations.langgraph",
    "agent_contracts.integrations.google_adk",
    "agent_contracts.integrations.claude_agent_sdk",
    "agent_contracts.integrations.causalchamber",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=agent_contracts",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.uv]
# LiteLLM >=1.83.7 hard-pins python-dotenv==1.0.1, which has
# GHSA-mf9w-mj56-hr94 (fixed in 1.2.2). Override lets uv ignore that
# pin so the base install keeps a patched python-dotenv.
override-dependencies = ["python-dotenv>=1.2.2"]
