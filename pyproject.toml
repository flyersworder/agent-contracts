[project]
name = "ai-agent-contracts"
# Version must match src/agent_contracts/__init__.py:__version__
version = "0.1.0"
description = "A formal framework for governing autonomous AI agents through explicit resource constraints and temporal boundaries"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Qing", email = "qingye779@gmail.com" }]
license = { text = "Apache-2.0" }
keywords = ["ai-agents", "llm", "resource-management", "governance", "contracts", "langchain", "langgraph", "google-adk", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "litellm>=1.60.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/flyersworder/agent-contracts"
Repository = "https://github.com/flyersworder/agent-contracts"
Issues = "https://github.com/flyersworder/agent-contracts/issues"
Documentation = "https://github.com/flyersworder/agent-contracts/blob/main/docs/README.md"

[project.optional-dependencies]
eval = [
    "datasets>=4.4.2",
    "matplotlib>=3.10.7",
]
langchain = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=4.1.2",
]
langgraph = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
]
google-adk = [
    "google-adk>=1.18.0",
]
claude-agent-sdk = [
    "claude-agent-sdk>=0.1.50",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "scipy>=1.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_contracts"]

[tool.ruff]
# Target Python 3.12+
target-version = "py312"

# Line length
line-length = 100

# Exclude common directories
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), isort (I), and more
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Test files can use assertions and relative imports
"tests/**/*.py" = ["S101", "TID252"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Integration modules use try/except imports for optional dependencies,
# which conflicts with strict mypy when the packages are installed.
[[tool.mypy.overrides]]
module = [
    "agent_contracts.integrations",
    "agent_contracts.integrations.langchain",
    "agent_contracts.integrations.langgraph",
    "agent_contracts.integrations.google_adk",
    "agent_contracts.integrations.claude_agent_sdk",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=agent_contracts",
    "--cov-report=term-missing",
    "--cov-report=html",
]
